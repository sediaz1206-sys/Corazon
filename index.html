<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }


        /* CONTENEDOR */

        .heart-container {

            position: relative;

            width: 650px;
            height: 650px;

            animation: heartbeat 2s infinite ease-in-out;
        }


        /* PALABRAS */

        .love {

            position: absolute;

            color: #ea80b0;

            font-size: 16px;

            font-weight: bold;

            white-space: nowrap;

            text-shadow:

                0 0 3px white,
                0 0 7px #ea80b0,
                0 0 12px #ea80b0,
                0 0 20px #ea80b0;

            user-select: none;

            pointer-events: none;
        }


        /* LATIDO */

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.04);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.04);
            }

            40% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* PARTICULAS */

        .particle {

            position: fixed;

            width: 3px;
            height: 3px;

            background: #ea80b0;

            border-radius: 50%;

            box-shadow:
                0 0 5px #ea80b0,
                0 0 10px #ea80b0;

            animation:
                float 4s linear infinite;

            pointer-events: none;
        }


        @keyframes float {

            0% {

                opacity: 0;

                transform:
                    translateY(0)
                    scale(0.5);
            }

            30% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-150px)
                    scale(1.5);
            }
        }


        /* RESPONSIVE */

        @media(max-width: 700px) {

            .heart-container {

                width: 100vw;
                height: 100vw;

                max-width: 500px;
                max-height: 500px;
            }

            .love {

                font-size: 11px;
            }
        }


        @media(max-width: 400px) {

            .love {

                font-size: 9px;
            }
        }

    </style>

</head>


<body>


    <div class="heart-container" id="heart"></div>


    <script>

        const heart = document.getElementById("heart");


        /*
        ==========================================
                 CONFIGURACIÓN
        ==========================================
        */

        const cantidad = 240;

        const escala = 15;

        const texto = "Te amo Sirley";


        /*
        ==========================================
                 ECUACIÓN DEL CORAZÓN
        ==========================================
        */

        function corazon(t) {

            const x =
                16 * Math.pow(Math.sin(t), 3);


            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);


            return {

                x: x * escala,

                y: -y * escala

            };

        }


        /*
        ==========================================
                 CREAR PALABRAS
        ==========================================
        */

        const palabras = [];


        for (let i = 0; i < cantidad; i++) {

            const palabra =
                document.createElement("div");


            palabra.className = "love";


            palabra.innerText = texto;


            heart.appendChild(palabra);


            palabras.push(palabra);

        }


        /*
        ==========================================
                 ANIMACIÓN
        ==========================================
        */

        let movimiento = 0;


        function animar() {

            movimiento += 0.002;


            palabras.forEach((palabra, i) => {


                /*
                Posición sobre el corazón
                */

                const t =
                    (i / cantidad)
                    * Math.PI
                    * 2
                    + movimiento;


                const punto =
                    corazon(t);


                /*
                Siguiente punto para calcular
                la dirección del texto
                */

                const siguiente =
                    corazon(t + 0.01);


                const dx =
                    siguiente.x - punto.x;


                const dy =
                    siguiente.y - punto.y;


                const angulo =
                    Math.atan2(dy, dx)
                    * 180 / Math.PI;


                /*
                Pequeñas variaciones para
                crear grosor
                */

                const capa =
                    Math.sin(i * 2.7) * 3;


                /*
                Posición
                */

                palabra.style.left =
                    `calc(50% + ${punto.x + capa}px)`;


                palabra.style.top =
                    `calc(50% + ${punto.y}px)`;


                /*
                Rotación
                */

                palabra.style.transform =

                    `translate(-50%, -50%)
                     rotate(${angulo}deg)`;


            });


            requestAnimationFrame(animar);

        }


        animar();



        /*
        ==========================================
                 PARTICULAS
        ==========================================
        */

        function crearParticula() {


            const particula =
                document.createElement("div");


            particula.className =
                "particle";


            /*
            Posición aleatoria
            */

            particula.style.left =
                Math.random() * 100 + "vw";


            particula.style.top =
                (60 + Math.random() * 40) + "vh";


            /*
            Tamaño aleatorio
            */

            const tamaño =
                Math.random() * 3 + 1;


            particula.style.width =
                tamaño + "px";


            particula.style.height =
                tamaño + "px";


            /*
            Duración aleatoria
            */

            particula.style.animationDuration =

                (Math.random() * 3 + 3)
                + "s";


            document.body.appendChild(particula);


            /*
            Eliminar después
            */

            setTimeout(() => {

                particula.remove();

            }, 6000);

        }


        /*
        Crear partículas continuamente
        */

        setInterval(
            crearParticula,
            150
        );


    </script>


</body>

</html>
